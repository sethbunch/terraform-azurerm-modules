name: terraform

on:
  pull_request:
    paths:
      - "**.tf"
      - ".github/workflows/**"
  push:
    branches: [main]

permissions:
  contents: read

# NOTE: terraform plan job disabled — requires Azure OIDC secrets (app registration
# with federated credential). WGU student tenant blocks app registration, so plan
# runs locally until a tenant with directory rights is wired up. fmt + validate +
# Trivy (misconfig + secret) remain the CI quality gates.
jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Trivy IaC + secret scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig,secret
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

